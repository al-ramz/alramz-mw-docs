site_name: Software AG to Spring Boot Migration Requirement Gathering
site_url: https://Gaurav9969351313.github.io/alramz-mw-migration-docs
site_description: Software AG to Spring Boot Migration Documentation
site_author: Al Ramz

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - ADRs:
    - ADR/index.md
    - 'ADR-0: Requirements': ADR/ADR_0_Requirements.md
    - 'ADR-1: Secret Management': ADR/ADR_1_Secret_Management.md
    - 'ADR-2: Azure Compute (Draft)': ADR/ADR_2_Azure_Compute.md
    - 'ADR-3: Distributed Caching (Draft)': ADR/ADR_3_Caching_Strategy.md
    - 'ADR-4: Security Architecture Deferred': ADR/ADR_4_Security_Architecture_Deferred.md
  - Drafts:
    - drafts/index.md
    - 'AlRamz Portal - API': drafts/alramzportal/AlRamzPortal-API-Documentation.md
    - 'DMS Integration - API': drafts/dms/DMSIntegration-API-Documentation.md
    - 'VeriPhone - API': drafts/veriphone/VeriPhone-Verify-API-Documentation.md
    - 'IBAN Validation - API': drafts/iban/IBAN_Validation_Service_API_Documentation.md
    - 'Social Media - API': drafts/socialmedia/SocialMedia-API-Documentation.md
    - 'Banking - API': drafts/banking/BankIntegration-CorporateBanking-API-Documentation.md
  - Final:
    - final/index.md
    - 'DFM Onboarding - API': final/dfmonboarding/DFM_Onboarding_API_Documentation.md

plugins:
  - search

extra_css:
  - assets/auth/auth.css

extra_javascript:
  - assets/auth/auth-config.js
  - assets/auth/auth.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Gaurav9969351313/alramz-mw-migration-docs
